<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Page Turner — Tiệm sách cũ và quý hiếm Việt Nam">
  <title>The Page Turner — Sách cũ & quý hiếm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('page-turner-theme') || 'light';
        var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme-mode', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body class="app-body">
  <header id="header"></header>
  <main id="app" tabindex="-1"></main>
  <footer id="footer"></footer>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
